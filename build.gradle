plugins {
    id 'fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // main: version-independent core (config, routing, Shadowsocks); client: Minecraft integration.
    splitEnvironmentSourceSets()

    mods {
        routeweaver {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.wispforest.io' }
    // owo-lib depends on kdl4j, which is only published on JitPack.
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.kdl-org' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(modImplementation("io.wispforest:owo-lib:${project.owo_version}"))
    include(implementation("org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"))

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def expansions = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version,
    ]
    inputs.properties expansions
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand expansions
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

test {
    useJUnitPlatform()
    // Minecraft's log4j config writes logs/ into the working directory; keep it out of the repo.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
