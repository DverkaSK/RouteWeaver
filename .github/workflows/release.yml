name: Release

# Every Minecraft version lives on its own branch (1.21.11, 26.1.2, ...). A release is a tag on
# that branch named v<mod_version>+<minecraft_version>, e.g. v1.0.0+1.21.11, matching the jar name.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against gradle.properties
        id: version
        run: |
          mod=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          expected="v${mod}+${mc}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties, expected $expected"
            exit 1
          fi
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build

      - uses: softprops/action-gh-release@v2
        with:
          name: RouteWeaver ${{ steps.version.outputs.mod }} for Minecraft ${{ steps.version.outputs.mc }}
          files: build/libs/routeweaver-${{ steps.version.outputs.mod }}+${{ steps.version.outputs.mc }}.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
